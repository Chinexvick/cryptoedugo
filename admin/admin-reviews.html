<script>
  var adminHam = document.getElementById('adminHam');
  var adminSide = document.querySelector('.admin-side');
  var adminScrim = document.querySelector('.admin-scrim');
  if (adminHam) {
    adminHam.addEventListener('click', function(){ adminSide.classList.add('open'); adminScrim.classList.add('open'); });
    adminScrim.addEventListener('click', function(){ adminSide.classList.remove('open'); adminScrim.classList.remove('open'); });
  }
</script>

<script type="module">
  import { supabase, requireAdmin, escapeHtml } from './assets/js/supabase-client.js';

  function starsHtml(rating) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
      html += i <= rating
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>';
    }
    return html;
  }
  function timeAgo(dateStr) {
    const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
    if (days < 1) return 'Today';
    if (days === 1) return '1 day ago';
    return days + ' days ago';
  }

  function rowHtml(r) {
    return `
      <div class="reviews-mod-row" data-review-id="${r.id}">
        <img src="https://i.pravatar.cc/80?u=${r.student_id}" alt="">
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
            <b style="font-size:14px;">${escapeHtml(r.student?.full_name || r.student?.username || 'Unknown')} <span style="color:var(--n50);font-weight:500;">— ${escapeHtml(r.course?.title || '—')}</span></b>
            <span style="font-size:12px;color:var(--n50);">${timeAgo(r.created_at)}</span>
          </div>
          <div class="stars" style="margin:4px 0;">${starsHtml(r.rating)}</div>
          <p style="font-size:13.5px;color:var(--n50);">${escapeHtml(r.body)}</p>
          ${r.admin_reply ? `<p style="font-size:12.5px;color:#0f9d63;margin-top:6px;">↳ Your reply: ${escapeHtml(r.admin_reply)}</p>` : ''}
          <div style="display:flex;gap:10px;margin-top:8px;">
            <button class="btn btn-sm btn-ghost" data-reply-review="${r.id}">${r.admin_reply ? 'Edit reply' : 'Reply'}</button>
            <button class="btn btn-sm btn-ghost" data-feature-review="${r.id}" data-featured="${r.is_featured}">${r.is_featured ? 'Unfeature' : 'Feature on course page'}</button>
          </div>
        </div>
      </div>`;
  }

  async function loadReviews() {
    const { data: reviews, error } = await supabase
      .from('reviews')
      .select('*, student:profiles(full_name, username), course:courses(title)')
      .order('created_at', { ascending: false });

    const list = document.getElementById('reviewsList');
    if (error) { list.innerHTML = '<p style="color:var(--danger);font-size:13px;">Failed to load reviews.</p>'; return; }

    if (!reviews || reviews.length === 0) {
      list.innerHTML = '<p style="color:var(--n50);font-size:13px;">No reviews yet.</p>';
      document.getElementById('reviewsSummaryLabel').textContent = '0 reviews';
      return;
    }

    const avg = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
    document.getElementById('reviewsSummaryLabel').textContent = `★ ${avg} average · ${reviews.length} reviews`;
    list.innerHTML = reviews.map(rowHtml).join('');

    list.querySelectorAll('[data-reply-review]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-reply-review');
        const review = reviews.find(r => r.id === id);
        const reply = prompt('Your reply to this review:', review.admin_reply || '');
        if (reply === null) return;
        const { error: rErr } = await supabase.from('reviews').update({ admin_reply: reply.trim() || null }).eq('id', id);
        if (rErr) { window.showToast(rErr.message); return; }
        window.showToast('Reply saved');
        loadReviews();
      });
    });
    list.querySelectorAll('[data-feature-review]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-feature-review');
        const currentlyFeatured = btn.getAttribute('data-featured') === 'true';
        const { error: fErr } = await supabase.from('reviews').update({ is_featured: !currentlyFeatured }).eq('id', id);
        if (fErr) { window.showToast(fErr.message); return; }
        window.showToast(currentlyFeatured ? 'Removed from featured' : 'Featured on course page');
        loadReviews();
      });
    });
  }

  (async () => {
    const admin = await requireAdmin();
    if (!admin) return;
    loadReviews();
  })();
</script>
