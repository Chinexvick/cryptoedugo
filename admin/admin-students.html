<div class="panel">
  <div class="panel-head">
    <div><h3>All students</h3><p id="studentCountLabel">Loading…</p></div>
    <input type="text" placeholder="Search students…" id="studentSearchInput" style="padding:9px 14px;border-radius:8px;background:#0f0f12;border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13.5px;">
  </div>
  <table class="data-table">
    <thead><tr><th>Student</th><th>Courses owned</th><th>Total spent</th><th>Joined</th><th></th></tr></thead>
    <tbody id="studentsTableBody">
      <tr><td colspan="5" style="color:var(--n50);text-align:center;padding:24px;">Loading…</td></tr>
    </tbody>
  </table>

</div>

<script src="assets/js/admin-config.js"></script>
<script src="assets/js/main.js"></script>
<script>
  var adminHam = document.getElementById('adminHam');
  var adminSide = document.querySelector('.admin-side');
  var adminScrim = document.querySelector('.admin-scrim');
  if (adminHam) {
    adminHam.addEventListener('click', function(){ adminSide.classList.add('open'); adminScrim.classList.add('open'); });
    adminScrim.addEventListener('click', function(){ adminSide.classList.remove('open'); adminScrim.classList.remove('open'); });
  }
</script>

<script type="module">
  import { supabase, requireAdmin, formatPrice, escapeHtml } from './assets/js/supabase-client.js';

  let allStudents = [];

  function render(students) {
    const tbody = document.getElementById('studentsTableBody');
    if (students.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:var(--n50);text-align:center;padding:24px;">No students match.</td></tr>';
      return;
    }
    tbody.innerHTML = students.map(s => `
      <tr>
        <td>${escapeHtml(s.full_name || s.username || 'Unnamed')}</td>
        <td>${s.courseCount}</td>
        <td>${formatPrice(s.totalSpent)}</td>
        <td>${new Date(s.created_at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}</td>
        <td><div class="row-actions"><a href="admin-student-detail.html?id=${s.id}" aria-label="View"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></a></div></td>
      </tr>`).join('');
  }

  (async () => {
    const admin = await requireAdmin();
    if (!admin) return;

    const { data: students, error } = await supabase
      .from('profiles')
      .select('id, full_name, username, email, created_at')
      .eq('role', 'student')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('studentsTableBody').innerHTML = '<tr><td colspan="5" style="color:var(--danger);text-align:center;padding:24px;">Failed to load students.</td></tr>';
      return;
    }

    const { data: enrollments } = await supabase.from('enrollments').select('student_id, course_id').eq('status', 'paid');
    const { data: orderItems } = await supabase
      .from('order_items')
      .select('price_cents, order:orders!inner(student_id, status)')
      .eq('order.status', 'paid');

    const courseCounts = {};
    (enrollments || []).forEach(e => { courseCounts[e.student_id] = (courseCounts[e.student_id] || 0) + 1; });

    const spendTotals = {};
    (orderItems || []).forEach(oi => {
      const sid = oi.order?.student_id;
      if (sid) spendTotals[sid] = (spendTotals[sid] || 0) + oi.price_cents;
    });

    allStudents = (students || []).map(s => ({
      ...s,
      courseCount: courseCounts[s.id] || 0,
      totalSpent: spendTotals[s.id] || 0,
    }));

    document.getElementById('studentCountLabel').textContent = `${allStudents.length} total`;
    render(allStudents);

    document.getElementById('studentSearchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      render(allStudents.filter(s => (s.full_name || '').toLowerCase().includes(q) || (s.username || '').toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q)));
    });
  })();
</script>
