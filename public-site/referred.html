<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You've been invited — Neko Academy</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-image">
    <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=1200&q=80" alt="Student studying blockchain development on a laptop outdoors">
  </div>
  <div class="auth-panel">
    <div class="confirm-box">
      <a href="index.html" class="auth-logo">
        <span class="brand-mark"><img src="assets/img/logo-icon.png" alt="Neko Academy logo"></span>
        <span style="color:#000;">Neko Academy</span>
      </a>
      <h2>Thanks for joining through a referral! 🎉</h2>
      <div class="confirm-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <p>A Neko Academy student invited you to start learning with us. Create a free account to unlock access to all courses, track your progress, and start earning your own certificates.</p>
      </div>
      <a href="#" class="btn btn-primary" style="margin-top:8px;align-self:flex-start;" id="referredCreateBtn">Create free account</a>
      <p style="margin-top:14px;font-size:13.5px;color:var(--n700);">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
  (function () {
    var refCode = new URLSearchParams(window.location.search).get('ref');
    if (refCode) {
      try { localStorage.setItem('crypedugo_ref_code', refCode); } catch (e) {}
    }
    var btn = document.getElementById('referredCreateBtn');
    btn.href = refCode ? 'create-account.html?ref=' + encodeURIComponent(refCode) : 'create-account.html';
  })();
</script>
</body>
</html>
