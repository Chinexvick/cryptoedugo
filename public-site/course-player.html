<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Player — CrypEduGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CrypEduGo">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="player-shell">
  <div class="player-main">
    <div class="player-topbar">
      <a href="account-courses.html" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> <span id="playerCourseTitle">Loading…</span></a>
      <div style="display:flex;align-items:center;gap:14px;">
        <span style="font-size:12.5px;color:var(--n50);" id="playerPercentLabel"></span>
        <a href="dashboard.html" class="icon-btn" aria-label="Close player" style="color:#fff;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></a>
      </div>
    </div>

    <div class="player-video" id="playerVideoWrap">
      <p style="color:var(--n50);font-size:14px;">Loading lesson…</p>
    </div>

    <div class="player-tabs">
      <button class="active" data-player-tab="overview">Overview</button>
      <button data-player-tab="quiz" id="quizTabBtn" style="display:none;">Module Quiz</button>
      <button data-player-tab="qa">Q&amp;A</button>
    </div>

    <div class="player-content">
      <div class="player-panel active" id="ptab-overview">
        <h2 id="lessonTitle">Select a lesson</h2>
        <p id="lessonMeta" style="color:var(--n700);"></p>
        <div style="display:flex;gap:10px;margin-top:24px;">
          <button class="btn btn-primary btn-sm" id="markCompleteBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><polyline points="20 6 9 17 4 12"/></svg>
            Mark lesson complete
          </button>
        </div>
      </div>

      <div class="player-panel" id="ptab-quiz">
        <div id="quizContainer"><p style="color:var(--n700);font-size:14.5px;">Loading quiz…</p></div>
      </div>

      <div class="player-panel" id="ptab-qa">
        <h2>Questions on this lesson</h2>
        <p style="color:var(--n700);font-size:14px;">Have a question about this lesson? Post it in the <a href="account-community.html">community</a> or <a href="messages.html">message an admin directly</a> — Q&amp;A threads per-lesson are coming soon.</p>
      </div>
    </div>

    <div class="player-footer-nav">
      <button class="btn btn-outline" id="prevLessonBtn" disabled>← Previous lesson</button>
      <button class="btn btn-primary" id="nextLessonBtn" disabled>Next lesson →</button>
    </div>
  </div>

  <aside class="player-sidebar">
    <div class="player-sidebar-head">
      <h3>Course content</h3>
      <div class="player-progress-label"><span id="playerLessonCount">0 / 0 lessons</span><span id="playerPercentLabel2">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="playerProgressFill" style="width:0%;"></div></div>
    </div>
    <div class="player-modules" id="playerModules">
      <p style="padding:20px;color:var(--n700);font-size:13.5px;">Loading course content…</p>
    </div>
  </aside>
</div>

<script src="assets/js/main.js"></script>
<script type="module">
  import { supabase, requireAuth, escapeHtml } from './assets/js/supabase-client.js';

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const requestedLessonId = params.get('lesson');

  let course = null;
  let modules = [];
  let lessons = [];
  let progressByLesson = {}; // lesson_id -> { completed }
  let currentLesson = null;

  document.querySelectorAll('[data-player-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-player-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.player-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('ptab-' + btn.getAttribute('data-player-tab')).classList.add('active');
      if (btn.getAttribute('data-player-tab') === 'quiz') loadQuiz();
    });
  });

  function flatLessonList() {
    return lessons.slice().sort((a, b) => a.position - b.position);
  }

  function renderSidebar() {
    const flat = flatLessonList();
    const total = flat.length;
    const done = flat.filter(l => progressByLesson[l.id]?.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById('playerLessonCount').textContent = `${done} / ${total} lessons`;
    document.getElementById('playerPercentLabel2').textContent = pct + '%';
    document.getElementById('playerPercentLabel').textContent = pct + '% complete';
    document.getElementById('playerProgressFill').style.width = pct + '%';

    const wrap = document.getElementById('playerModules');
    wrap.innerHTML = modules.map(m => {
      const modLessons = flat.filter(l => l.module_id === m.id);
      return `<div class="player-module">
        <div class="player-module-head">${escapeHtml(m.title)}</div>
        ${modLessons.map(l => {
          const isDone = !!progressByLesson[l.id]?.completed;
          const isActive = currentLesson && currentLesson.id === l.id;
          return `<div class="player-lesson ${isDone ? 'done' : ''} ${isActive ? 'active' : ''}" data-lesson-id="${l.id}">
            <div class="dot">${isDone ? '<svg viewBox="0 0 24 24" fill="none" stroke="#0b0b0d" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</div>
            ${escapeHtml(l.title)} <span class="time">${l.duration_minutes}m</span>
          </div>`;
        }).join('')}
      </div>`;
    }).join('') || '<p style="padding:20px;color:var(--n700);font-size:13.5px;">This course has no published lessons yet — check back soon.</p>';

    wrap.querySelectorAll('.player-lesson').forEach(el => {
      el.addEventListener('click', () => selectLesson(el.getAttribute('data-lesson-id')));
    });
  }

  function renderLesson() {
    const flat = flatLessonList();
    const idx = flat.findIndex(l => currentLesson && l.id === currentLesson.id);
    document.getElementById('prevLessonBtn').disabled = idx <= 0;
    document.getElementById('nextLessonBtn').disabled = idx === -1 || idx >= flat.length - 1;

    if (!currentLesson) {
      document.getElementById('playerVideoWrap').innerHTML = '<p style="color:var(--n50);font-size:14px;">No lesson selected.</p>';
      return;
    }

    document.getElementById('lessonTitle').textContent = currentLesson.title;
    document.getElementById('lessonMeta').textContent = `${currentLesson.duration_minutes} min · ${currentLesson.content_type}`;

    const videoWrap = document.getElementById('playerVideoWrap');
    if (currentLesson.video_url) {
      videoWrap.innerHTML = `<video controls playsinline style="width:100%;height:100%;object-fit:contain;background:#000;" src="${escapeHtml(currentLesson.video_url)}"></video>`;
    } else {
      videoWrap.innerHTML = '<p style="color:var(--n50);font-size:14px;padding:20px;text-align:center;">Video not available for this lesson.</p>';
    }

    const isDone = !!progressByLesson[currentLesson.id]?.completed;
    const btn = document.getElementById('markCompleteBtn');
    btn.disabled = isDone;
    btn.textContent = isDone ? 'Lesson complete ✓' : 'Mark lesson complete';
    btn.innerHTML = isDone
      ? 'Lesson complete ✓'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><polyline points="20 6 9 17 4 12"/></svg>Mark lesson complete';

    document.getElementById('quizTabBtn').style.display = currentLesson.content_type === 'quiz' ? '' : 'none';

    // Update the URL so refresh/back keeps the same lesson without reloading the page.
    const url = new URL(window.location.href);
    url.searchParams.set('lesson', currentLesson.id);
    window.history.replaceState({}, '', url);
  }

  function selectLesson(lessonId) {
    const found = lessons.find(l => l.id === lessonId);
    if (!found) return;
    currentLesson = found;
    document.querySelectorAll('[data-player-tab]')[0].click();
    renderSidebar();
    renderLesson();
  }

  async function markComplete() {
    if (!currentLesson) return;
    const { data: { session } } = await supabase.auth.getSession();
    const { error } = await supabase
      .from('lesson_progress')
      .upsert(
        { student_id: session.user.id, lesson_id: currentLesson.id, course_id: course.id, completed: true, completed_at: new Date().toISOString() },
        { onConflict: 'student_id,lesson_id' }
      );
    if (error) {
      window.showToast && window.showToast('Could not save progress: ' + error.message);
      return;
    }
    progressByLesson[currentLesson.id] = { completed: true };
    renderSidebar();
    renderLesson();
    await updateEnrollmentProgress();
  }

  async function updateEnrollmentProgress() {
    const flat = flatLessonList();
    const total = flat.length;
    const done = flat.filter(l => progressByLesson[l.id]?.completed).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const patch = { progress_percent: pct, last_activity_at: new Date().toISOString() };
    if (pct === 100) patch.completed_at = new Date().toISOString();
    await supabase.from('enrollments').update(patch).eq('course_id', course.id);
  }

  async function loadQuiz() {
    if (!currentLesson || currentLesson.content_type !== 'quiz') return;
    const container = document.getElementById('quizContainer');
    container.innerHTML = '<p style="color:var(--n700);font-size:14.5px;">Loading quiz…</p>';
    const { data, error } = await supabase.rpc('get_quiz_for_lesson', { p_lesson_id: currentLesson.id });
    if (error || !data || data.length === 0) {
      container.innerHTML = '<p style="color:var(--n700);font-size:14.5px;">No quiz for this lesson yet.</p>';
      return;
    }
    const byQuestion = {};
    data.forEach(row => {
      byQuestion[row.question_id] = byQuestion[row.question_id] || { prompt: row.prompt, options: [] };
      byQuestion[row.question_id].options.push({ id: row.option_id, label: row.option_label });
    });
    const questions = Object.entries(byQuestion);
    let qi = 0;

    function renderQuestion() {
      if (qi >= questions.length) {
        container.innerHTML = '<p style="color:var(--mint);font-weight:700;">Quiz complete — nice work!</p>';
        return;
      }
      const [questionId, q] = questions[qi];
      container.innerHTML = `<div class="quiz-card">
        <div class="quiz-progress">Question ${qi + 1} of ${questions.length}</div>
        <div class="quiz-question">${escapeHtml(q.prompt)}</div>
        ${q.options.map((o, i) => `<div class="quiz-option" data-option-id="${o.id}"><span class="letter">${String.fromCharCode(65 + i)}</span> ${escapeHtml(o.label)}</div>`).join('')}
        <button class="btn btn-primary btn-sm" style="margin-top:18px;" id="quizNextBtn" disabled>Next question</button>
      </div>`;

      let answered = false;
      container.querySelectorAll('.quiz-option').forEach(el => {
        el.addEventListener('click', async () => {
          if (answered) return;
          answered = true;
          container.querySelectorAll('.quiz-option').forEach(o => o.style.pointerEvents = 'none');
          const { data: result, error: gradeErr } = await supabase.rpc('grade_quiz_attempt', {
            p_question_id: questionId,
            p_option_id: el.getAttribute('data-option-id'),
          });
          if (gradeErr) {
            window.showToast && window.showToast(gradeErr.message);
          } else if (result) {
            el.classList.add('correct');
          } else {
            el.classList.add('incorrect');
          }
          document.getElementById('quizNextBtn').disabled = false;
        });
      });
      document.getElementById('quizNextBtn').addEventListener('click', () => {
        qi += 1;
        renderQuestion();
      });
    }
    renderQuestion();
  }

  document.getElementById('markCompleteBtn').addEventListener('click', markComplete);
  document.getElementById('nextLessonBtn').addEventListener('click', () => {
    const flat = flatLessonList();
    const idx = flat.findIndex(l => currentLesson && l.id === currentLesson.id);
    if (idx > -1 && idx < flat.length - 1) selectLesson(flat[idx + 1].id);
  });
  document.getElementById('prevLessonBtn').addEventListener('click', () => {
    const flat = flatLessonList();
    const idx = flat.findIndex(l => currentLesson && l.id === currentLesson.id);
    if (idx > 0) selectLesson(flat[idx - 1].id);
  });

  async function init() {
    const session = await requireAuth('login.html');
    if (!session) return;

    if (!slug) {
      document.getElementById('playerVideoWrap').innerHTML = '<p style="color:var(--n50);padding:20px;">No course specified.</p>';
      return;
    }

    const { data: courseRow, error: courseErr } = await supabase
      .from('courses')
      .select('id, title, slug')
      .eq('slug', slug)
      .single();
    if (courseErr || !courseRow) {
      document.getElementById('playerVideoWrap').innerHTML = '<p style="color:var(--n50);padding:20px;">Course not found.</p>';
      return;
    }
    course = courseRow;
    document.getElementById('playerCourseTitle').textContent = course.title;
    document.title = course.title + ' — Course Player — CrypEduGo';

    const { data: enrollment } = await supabase
      .from('enrollments')
      .select('id, status')
      .eq('course_id', course.id)
      .eq('student_id', session.user.id)
      .maybeSingle();

    const { data: profile } = await supabase
      .from('profiles')
      .select('trial_ends_at')
      .eq('id', session.user.id)
      .single();
    const trialActive = profile?.trial_ends_at && new Date(profile.trial_ends_at) > new Date();

    if ((!enrollment || enrollment.status !== 'paid') && !trialActive) {
      document.getElementById('playerVideoWrap').innerHTML =
        `<p style="color:var(--n50);padding:20px;text-align:center;">Your free trial has ended and you're not enrolled in this course. <a href="course-detail.html?slug=${encodeURIComponent(slug)}" style="color:var(--primary-glow);">Purchase this course</a> to keep learning.</p>`;
      return;
    }
    if ((!enrollment || enrollment.status !== 'paid') && trialActive) {
      const banner = document.createElement('div');
      banner.className = 'trial-banner';
      banner.innerHTML = `<span>🎁 You're in your free trial —</span> <span class="trial-banner-time" id="playerTrialCountdown"></span> <span>left to explore this course.</span>`;
      document.querySelector('.player-main').prepend(banner);
      window.startTrialCountdown && window.startTrialCountdown('playerTrialCountdown', profile.trial_ends_at);
    }

    const { data: moduleRows } = await supabase
      .from('course_modules')
      .select('id, title, position')
      .eq('course_id', course.id)
      .order('position');
    modules = moduleRows || [];

    const { data: lessonRows } = await supabase.rpc('get_lesson_catalog', { p_course_id: course.id });
    lessons = lessonRows || [];

    const { data: progressRows } = await supabase
      .from('lesson_progress')
      .select('lesson_id, completed')
      .eq('student_id', session.user.id)
      .eq('course_id', course.id);
    (progressRows || []).forEach(p => { progressByLesson[p.lesson_id] = { completed: p.completed }; });

    const flat = flatLessonList();
    const wanted = requestedLessonId && flat.find(l => l.id === requestedLessonId);
    const firstIncomplete = flat.find(l => !progressByLesson[l.id]?.completed);
    currentLesson = wanted || firstIncomplete || flat[0] || null;

    renderSidebar();
    renderLesson();
  }

  init();
</script>
</body>
</html>
