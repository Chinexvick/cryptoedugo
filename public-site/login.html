<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — CrypEduGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-image">
    <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=1200&q=80" alt="Student studying blockchain development on a laptop outdoors">
  </div>
  <div class="auth-panel">
    <div class="auth-form">
      <a href="index.html" class="auth-logo">
        <span class="brand-mark"><img src="assets/img/logo-icon.png" alt="CrypEduGo logo"></span>
        <span style="color:#000;">CrypEduGo</span>
      </a>

      <form data-redirect="dashboard.html" id="loginForm">
        <div class="auth-head">
          <h1>Log in</h1>
          <a href="create-account.html" id="createAccountLink">Create Account</a>
        </div>

        <div class="field has-icon">
          <div class="input-wrap">
            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="email" placeholder="Email" id="loginEmail" required>
          </div>
        </div>
        <div class="field has-icon">
          <div class="input-wrap">
            <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" placeholder="Password" id="loginPassword" required>
            <button type="button" class="toggle-pass" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>

        <div class="field-row">
          <label class="remember"><input type="checkbox"> Remember Me</label>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <div id="loginError" style="display:none;background:#fdeaea;color:#b3261e;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">Log In</button>
      </form>

      <p class="auth-terms">Terms of Service <b>and</b> Privacy Policy</p>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script type="module">
  import { supabase, getPostLoginRedirect } from './assets/js/supabase-client.js';

  var form = document.getElementById('loginForm');
  var emailInput = document.getElementById('loginEmail');
  var passwordInput = document.getElementById('loginPassword');
  var errorBox = document.getElementById('loginError');
  var submitBtn = document.getElementById('loginSubmitBtn');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  supabase.auth.getSession().then(function(result) {
    if (result.data.session) window.location.href = getPostLoginRedirect();
  });

  var failedAttempts = 0;

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const { data, error } = await supabase.auth.signInWithPassword({
      email: emailInput.value.trim(),
      password: passwordInput.value,
    });

    if (error) {
      showError(error.message === 'Invalid login credentials'
        ? 'Incorrect email or password.'
        : error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      failedAttempts++;
      if (failedAttempts >= 2 && window.notifyAssistant) {
        window.notifyAssistant({
          message: "Having trouble logging in? I can help you reset your password.",
          actionsHtml: '<a href="forgot-password.html">🔑 Reset password</a><a href="contact.html">💬 Contact support</a>',
        });
      }
      return;
    }

    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('role, is_suspended')
      .eq('id', data.user.id)
      .single();

    if (profileError || !profile) {
      showError('Could not load your account. Please try again.');
      await supabase.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      return;
    }

    if (profile.is_suspended) {
      showError('This account has been suspended. Contact support for help.');
      await supabase.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      return;
    }

    // General/student login. If an admin account happens to sign in here,
    // route them to their dashboard same as anyone else — no separate branch,
    // no hint anywhere on this page that a distinct admin path exists.
    window.location.href = getPostLoginRedirect();
  });
</script>
</body>
</html>
